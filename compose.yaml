# Primarily used for `docker compose config` validation and interactive
# shells (`make shell-wsclean` / `make shell-r2d2`). Actual smoke-test and
# benchmark runs use plain `docker run` (see scripts/) so that per-run
# bind mounts and commands stay explicit and easy to reason about
# individually.
#
# No `platform:` is pinned here. Docker builds and runs for the host
# architecture by default and applies DOCKER_DEFAULT_PLATFORM itself when it
# is set, so pinning one would only hardcode the wrong architecture on half
# the hosts this repo runs on.
services:
  wsclean:
    build:
      context: .
      dockerfile: docker/wsclean/Dockerfile
      args:
        WSCLEAN_PORTABLE: ${WSCLEAN_PORTABLE:-ON}
    image: ri-reproducibility/wsclean:v3.7
    entrypoint: ["wsclean"]
    command: ["--version"]
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${RESULTS_DIR:-./results}:/results
      - ./config/wsclean:/workspace/config:ro
    environment:
      - OMP_NUM_THREADS

  r2d2:
    build:
      context: .
      dockerfile: docker/r2d2/Dockerfile
    image: ri-reproducibility/r2d2:cpu
    entrypoint: ["python3"]
    command: ["--version"]
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${CHECKPOINTS_DIR:-./checkpoints}:/checkpoints
      - ${RESULTS_DIR:-./results}:/results
      - ./config/r2d2:/workspace/config:ro
    environment:
      - OMP_NUM_THREADS

  meqtrees:
    build:
      context: .
      dockerfile: docker/meqtrees/Dockerfile
    image: ri-reproducibility/meqtrees:kern-10
    command: ["--help"]
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${RESULTS_DIR:-./results}:/results

  polychord:
    build:
      context: .
      dockerfile: docker/polychord/Dockerfile
    image: ri-reproducibility/polychord:lite
    command: ["--help"]
    volumes:
      - .:/workspace/repo
      - ${DATA_DIR:-./data}:/data
      - ${RESULTS_DIR:-./results}:/results
      - /var/run/docker.sock:/var/run/docker.sock
