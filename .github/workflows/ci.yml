name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # Linting reads the source and does not care what it is running on, so it
  # stays on one runner rather than doubling with the matrix below.
  lint:
    name: Lint and syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check Python syntax
        run: python3 -m compileall -q scripts config

  # These execute code, and the code branches on the platform - rank-budget.sh
  # reads /proc/meminfo on Linux and vm_stat on macOS, and defaults.sh picks an
  # image architecture from `uname -m`. Both hosts run real searches, so both
  # get checked. Everything here is seconds of work and needs no Docker, which
  # is what keeps a second runner cheap.
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check the run-script libraries
        run: |
          bash scripts/lib/rank-budget.sh --self-check
          bash scripts/lib/start-sidecars.sh --self-check
          bash scripts/lib/run-config.sh --self-check
          bash scripts/lib/progress-bar.sh
          uv run --no-project python3 scripts/nested-sampling-runs.py
        env:
          NESTED_SAMPLING_RUNS_SELF_CHECK: "1"

      # Its own step because it shells out to `ps`, whose output format is one
      # of the things it parses - and that differs between the two runners.
      - name: Check the run health report
        run: uv run --no-project python3 scripts/nested-sampling-health.py
        env:
          NESTED_SAMPLING_HEALTH_SELF_CHECK: "1"

      - name: Check the deadlock watchdogs
        run: uv run --no-project python3 scripts/test_watchdogs.py

      - name: Check the image-free self-checks
        run: uv run --no-project python3 scripts/test_self_checks.py

      - name: Check shared defaults
        run: scripts/test-defaults.sh

      - name: Check the CLI
        run: uv run --no-project scripts/test_cli.py
