name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: Shell and Python checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck

      - name: Lint shell scripts
        run: shellcheck -x scripts/*.sh

      - name: Check shell syntax
        run: bash -n scripts/*.sh

      - name: Check Python syntax
        run: python3 -m compileall -q scripts config

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Check the run-script libraries
        run: |
          bash scripts/lib/rank-budget.sh --self-check
          bash scripts/lib/start-sidecars.sh --self-check
          bash scripts/lib/run-config.sh --self-check
          NESTED_SAMPLING_RUNS_SELF_CHECK=1 python3 scripts/nested-sampling-runs.py

      - name: Check the deadlock watchdogs
        run: python3 scripts/test_watchdogs.py

      - name: Check shared defaults
        run: scripts/test-defaults.sh

      - name: Check the CLI
        run: uv run --no-project scripts/test_cli.py
