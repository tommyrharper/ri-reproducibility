# Default values for the scripts under scripts/.
#
# This file is the single source of truth for every runtime default those
# scripts share. Change a value here and every script picks it up.
#
# Each key is the name of the environment variable it sets, and every one
# stays overridable from the environment: a value here is only applied when
# the variable is unset or empty, so
#
#     NS_SEED=7 make nested-sampling
#
# still runs with seed 7. `{REPO_ROOT}` expands to the repository root.
#
# Loaded by scripts/lib/defaults.sh, which the scripts source. Upstream
# software revisions are pinned in versions.env, not here.

# Container images built by scripts/build.sh.
R2D2_IMAGE = "ri-reproducibility/r2d2:cpu"
WSCLEAN_IMAGE = "ri-reproducibility/wsclean:v3.7"
MEQTREES_IMAGE = "ri-reproducibility/meqtrees:kern-10"
POLYCHORD_IMAGE = "ri-reproducibility/polychord:lite"

# DOCKER_DEFAULT_PLATFORM is intentionally absent: the architecture to build
# and run for is a property of the host, not of the project, so it is derived
# from `uname -m` in scripts/lib/defaults.sh. Export it to override.

CHECKPOINTS_DIR = "{REPO_ROOT}/checkpoints"
# The checkpoint set the R2D2 imager loads, as a directory under
# CHECKPOINTS_DIR on the host and under /checkpoints in the container.
# A name rather than a path, because the two sides disagree about the
# path and only ever agree about this.
R2D2_CKPT_NAME = "R2D2_A1"
RESULTS_DIR = "{REPO_ROOT}/results"

# Most concurrent R2D2 evaluations worth running, before the memory clamp in
# scripts/lib/rank-budget.sh has its say. R2D2 is core-bound, not rank-bound:
# measured on the 20-thread rig, paired and interleaved, throughput is flat
# from 8 ranks (0.878, 0.917 evaluations/second) to 15 (0.898, 0.916) while
# per-rank memory takes the run from 28GB to 53GB - per-evaluation work doubles
# and the total does not move. Without this cap the derived rank count is
# whatever memory allows, which buys nothing and spends the headroom a long run
# needs. WSClean has no equivalent: it is 200MB a rank and scales to one rank
# per core. See docs/nested-sampling-throughput.md.
# ponytail: one number measured on one host, not a live probe. Re-measure with
# `./ri search r2d2 --nlive 40 --num-repeats 2 --max-ndead 40 --mpi-procs N`
# on a machine with a different core count.
NS_R2D2_MAX_RANKS = 8

# Pixels on a side of the image both imagers make, and with it the field of
# view: source_offset_to_lm() in common.py scales the sampled
# `source_offset_fraction` by half of this, so two sizes are two different
# skies rather than the same sky at two costs.
#
# 32 because R2D2 is what a search waits on and its evaluation is
# `0.96s + 0.39ms/pixel` - measured over 128/64/32, interleaved, on the
# 20-thread rig - so 32 images at 1411ms against 128's 7451ms, a 5.3x that
# 16 would only take to 6.5x against the fixed second. WSClean is not
# pixel-bound and gets 1.5x from the same change. Runs archived before this
# were scored at 128; `NS_IMAGE_DIM=128 ./ri search ...` reproduces them, and
# run.env records what each run used. See "What the image size costs" in
# docs/nested-sampling.md.
NS_IMAGE_DIM = 32

# PolyChord sampler settings for the nested-sampling runs.
# See docs/nested-sampling.md for what each one does.
NS_NLIVE = 8
NS_NUM_REPEATS = 2
NS_MAX_NDEAD = 12
# NS_SEED is randomised per run in scripts/lib/defaults.sh and recorded in
# run.env/summary.json; `--seed` repeats a run and resume reuses run.env.
NS_METRIC = "total_rms_jy"

# PolyChord's MPI scheduling: 0 keeps ranks busy between stochastic chains;
# measured utilisation rose from 64% to 92% in a 15-rank WSClean search.
# See docs/nested-sampling-throughput.md for tradeoffs.
NS_SYNCHRONOUS = 0

# Keep every intermediate artefact of a scored evaluation - its Measurement Set
# and the four WSClean images the metrics have already been read out of (dirty,
# residual, model, psf). Off, because disk is what caps a run's size and those
# artefacts are 96% of it: the MS was 1.5MB of a 1.44MB mean evaluation
# directory and the four images are 293KB of the 394KB that was left. Nothing
# outside the evaluation reads any of them, the restored image, the metrics and
# every recorded argv are kept either way, a failed evaluation keeps
# everything, and both the MS and the images are reproducible from the record.
# 1 keeps them, which the replay benchmarks in
# docs/nested-sampling-throughput.md need. See
# docs/nested-sampling-disk-footprint.md.
NS_KEEP_MEASUREMENT_SETS = 0

# WSClean's major-cycle gain, and the largest throughput lever this repo has
# left: it sets how deep each minor loop goes, hence how many of the ~15
# gridding and degridding passes an evaluation pays for. 0.8 costs ~6.5 major
# cycles; 0.9 costs ~4.7 and is worth ~20% more evaluations per second, for a
# change in the default `total_rms_jy` objective of 1e-7 (median). It is not
# result-preserving for `peak_flux_abs_error_jy` or `sigma_res`, and it is part
# of the experiment definition every archived run was scored under, so the
# default stays where those runs were scored. See
# docs/nested-sampling-clean-loop.md for the per-metric cost and
# docs/nested-sampling-evaluation-floor.md for why nothing cheaper is left.
NS_WSCLEAN_MGAIN = 0.8

# CLEAN's minor-iteration budget per major cycle, WSClean's `-niter`. At the
# old value of 100 roughly four evaluations in five stopped on `maximum number
# of iterations` rather than on the auto-threshold (77-84% across five archived
# runs), so for most of the parameter space the objective scored the residual
# after 100 components rather than what CLEAN converges to - and the worst 200
# evaluations of a run were 90% capped against a 80% base rate, so the cap was
# shaping the failure map itself. 1000 lets most evaluations reach the
# threshold; each record's `clean_stop_reason` says which of the two ended it,
# so the question is now answerable from the summary rather than the logs.
# Costs imaging time: deconvolution was ~7% of an evaluation at 100.
NS_WSCLEAN_NITER = 10000

# How many times a search that died with work already banked restarts itself
# from PolyChord's checkpoint before giving up. 0 disables it. An attempt that
# scored no evaluations is never retried, and one that ran longer than
# NS_RETRY_RESET_SECONDS (1800) before dying hands the budget back, so this
# bounds a crash loop rather than the lifetime of a multi-day search - see
# run_with_retries in scripts/lib/progress-bar.sh.
NS_RETRIES = 2

# Seconds a run may go without finishing a single evaluation before it is
# killed so that NS_RETRIES can restart it from PolyChord's checkpoint. The
# backstop for a hang rather than a crash: run_with_retries only sees a run
# that exits, and a rank deadlocked in an MPI collective never does. 0
# disables it. Must stay clear of IMAGING_REPLY_TIMEOUT (3600s, common.py),
# which is how long one evaluation is already allowed to take - see
# _ns_stall_watchdog in scripts/lib/progress-bar.sh.
NS_STALL_TIMEOUT = 7200

# The parameter space the sampler searches, read by `load_parameter_space()`
# in scripts/lib/nested_sampling/common.py. The order is the order of
# PolyChord's unit cube, so reordering it invalidates existing chains,
# `kind = "integer"` rounds the scaled value to the nearest integer, and
# `kind = "band_start"` takes its range from the `[[receiver_band]]` list
# below instead of from `min`/`max`.
#
# Every entry also takes `enabled` (default true). Set `enabled = false` to
# pin a dimension out of the search instead of deleting it: `cube_to_params()`
# fixes it at its `default` (falling back to `min` when no `default` is
# given) rather than drawing it from the cube, so disabling a dimension does
# not require every downstream reader to special-case a missing key. This is
# the toggle `./ri search --enable-param` / `--disable-param` and `./ri
# params` also work through - see "Toggling dimensions on and off" in
# docs/nested-sampling.md. Toggling changes PolyChord's dimension count, so
# it invalidates existing chains the same way reordering does.
#
# Arrays of tables rather than environment variables, so defaults.sh skips
# them; they have to stay at the end of the file, because every key after a
# `[[table]]` header belongs to that table.

[[parameter_space]]
name = "log10_dynamic_range"
min = 1.0
max = 6.0

[[parameter_space]]
name = "observation_minutes"
min = 0.3
max = 20.0

[[parameter_space]]
name = "channel_count"
min = 1
max = 8
kind = "integer"

[[parameter_space]]
name = "start_frequency_hz"
kind = "band_start"

[[parameter_space]]
name = "channel_width_hz"
min = 0.1e6
max = 2.0e6

# Source offset from the phase centre, as a fraction of the image half-width,
# at a fixed 30 degree position angle (see docs/parameter-space-proposal.md,
# section 1). At exactly 0.0 (the old hard-coded behaviour) the source sits on
# the phase centre and disables bandwidth smearing, time smearing, the w-term
# and pixel-interpolation error outright, so `channel_width_hz`,
# `channel_count` and `observation_minutes` only buy visibility count. 0.35
# keeps the offset inside the small-field regime `ms_to_r2d2_mat.py`'s
# w-dropping needs to stay valid for R2D2 (see the same doc section).
[[parameter_space]]
name = "source_offset_fraction"
min = 0.0
max = 0.35
enabled = false

# Source position as a cartesian (l, m) offset from the central pixel, in
# pixels. `source_offset_fraction` above only moves along one 30 degree ray;
# these two axes reach any pixel, giving up that ray's freedom from
# axis-aligned symmetry.
#
# `kind = "image_pixels"` takes `fraction`, not min/max: the box is
# +/-(NS_IMAGE_DIM / 2) * fraction, so it tracks the image size instead of
# meaning a different fraction of the sky each time that moves. At 0.5 both
# axes at maximum sit 0.71 of the half-width out, past the 0.35 small-field
# limit `ms_to_r2d2_mat.py`'s w-dropping needs; use 0.25 to stay inside it.
#
# Continuous, not integer: landing between pixel centres is the
# pixel-interpolation error a centred source hides.
#
# Enabling these alongside `source_offset_fraction` is refused: the offsets
# add, so one position comes from many draws.
[[parameter_space]]
name = "source_l_pixels"
kind = "image_pixels"
fraction = 0.5
default = 0.0
enabled = false

[[parameter_space]]
name = "source_m_pixels"
kind = "image_pixels"
fraction = 0.5
default = 0.0
enabled = false

# Declination of the phase centre. +34 is the VLA's latitude and this
# `default`: overhead transit, the roundest PSF the array gets. Low declination
# foreshortens it into an elliptical beam with far worse sidelobes. Whole
# degrees, and disabled, because `Declination` is in the MS skeleton cache key.
# Proposal doc, section 5.
[[parameter_space]]
name = "declination_deg"
min = -15
max = 75
kind = "integer"
default = 34
enabled = false

# Correlator dump time, makems' `StepTime`: `NTimes = ceil(observation_minutes
# * 60 / this)`, so it trades sampling density against track length. The only
# dimension time smearing depends on - pair it with `source_offset_fraction`.
# 1-10 s is what a modern correlator does; `default` stays at the 120 s every
# archived run used, so disabling pins to today's behaviour rather than into
# the box. Disabled because a 1 s dump over a 20 minute track is 1200 time
# samples: a ~135 MB Measurement Set against 512 MB of /dev/shm, and a skeleton
# cache that no longer fits. Narrow `observation_minutes` before enabling it.
# Proposal doc, section 2.
[[parameter_space]]
name = "integration_seconds"
min = 1
max = 10
kind = "integer"
default = 10
enabled = false

# The receiver bands the sampled spectral window has to fit inside, in Hz.
# These are the VLA's; nothing in the code is VLA-specific, so pointing this
# repo at another telescope is a matter of replacing the list (any number of
# bands, in any order, gaps allowed).
#
# A `kind = "band_start"` parameter is not scaled onto a plain min/max box:
# each band that can hold the sampled `channel_count` x `channel_width_hz`
# window gets an equal share of the unit-cube dimension, and the start
# frequency is uniform inside that band's placeable range - so
# `start_frequency_hz + channel_count * channel_width_hz` never leaves the
# band the start frequency landed in. Equal share per band rather than
# uniform across the union of them, otherwise the 32 MHz-wide 4-band would be
# drawn about once in every 1500 evaluations and never actually searched.
#
# Each band also takes `enabled` (default true), the same toggle
# `[[parameter_space]]` has. `enabled = false` drops the band from the search
# without deleting it, so the frequency range is the union of the enabled
# bands only. Changing which bands are enabled changes the prior on
# `start_frequency_hz`, so it invalidates existing chains.

[[receiver_band]]
name = "4"
enabled = false
min = 54.0e6
max = 86.0e6

[[receiver_band]]
name = "P"
enabled = false
min = 224.0e6
max = 480.0e6

[[receiver_band]]
name = "L"
min = 1.0e9
max = 2.0e9

[[receiver_band]]
name = "S"
min = 2.0e9
max = 4.0e9

[[receiver_band]]
name = "C"
min = 4.0e9
max = 8.0e9

[[receiver_band]]
name = "X"
min = 8.0e9
max = 12.0e9

[[receiver_band]]
name = "Ku"
min = 12.0e9
max = 18.0e9

[[receiver_band]]
name = "K"
min = 18.0e9
max = 26.5e9

[[receiver_band]]
name = "Ka"
min = 26.5e9
max = 40.0e9

[[receiver_band]]
name = "Q"
min = 40.0e9
max = 50.0e9

# The controlled searches `./ri bench run <imager>` times, and the settings a
# row in benchmarks.jsonl is grouped by. Pinned rather than inherited from the
# defaults above, so a tuning change up there cannot silently redefine what
# every archived row was measured under - and the seed is pinned so repeats at
# one commit draw the same points, leaving only the host's own noise in the
# error bar. A table here rather than scalars, so defaults.sh skips it: these
# are not defaults for anything, only for the benchmark.
#
# Keys are environment-variable names, as above. Add a second preset by adding
# `[benchmark.<name>.<imager>]`; a run whose run.env matches every key of one
# is recorded under it, and everything else is recorded as `custom`. See
# docs/nested-sampling-benchmarks.md.

[benchmark.default.wsclean]
NS_NLIVE = 32
NS_NUM_REPEATS = 2
NS_MAX_NDEAD = 150
NS_SEED = 1
NS_METRIC = "total_rms_jy"
NS_SYNCHRONOUS = 1
NS_KEEP_MEASUREMENT_SETS = 0
NS_WSCLEAN_MGAIN = 0.8
NS_WSCLEAN_NITER = 100

# Sized down against the WSClean preset above, not for a shorter table: one
# R2D2 evaluation is 14-26 seconds of imaging against WSClean's 0.13, so these
# ~42 evaluations already cost ~2 minutes a repeat.
[benchmark.default.r2d2]
NS_NLIVE = 8
NS_NUM_REPEATS = 2
NS_MAX_NDEAD = 12
NS_SEED = 1
NS_METRIC = "total_rms_jy"
NS_SYNCHRONOUS = 1
NS_KEEP_MEASUREMENT_SETS = 0

# Production scheduling mode; the default preset stays synchronous so its
# fixed seed produces the same evaluation set on every repeat.
[benchmark.throughput.wsclean]
NS_NLIVE = 32
NS_NUM_REPEATS = 2
NS_MAX_NDEAD = 150
NS_SEED = 1
NS_METRIC = "total_rms_jy"
NS_SYNCHRONOUS = 0
NS_KEEP_MEASUREMENT_SETS = 0
NS_WSCLEAN_MGAIN = 0.8
NS_WSCLEAN_NITER = 100

[benchmark.throughput.r2d2]
NS_NLIVE = 8
NS_NUM_REPEATS = 2
NS_MAX_NDEAD = 12
NS_SEED = 1
NS_METRIC = "total_rms_jy"
NS_SYNCHRONOUS = 0
NS_KEEP_MEASUREMENT_SETS = 0

# Production-scale workload. Expensive by design: use explicitly when
# validating changes against the searches this project ultimately runs.
[benchmark.production.wsclean]
NS_NLIVE = 150
NS_NUM_REPEATS = 15
NS_MAX_NDEAD = -1
NS_SEED = 1
NS_METRIC = "total_rms_jy"
NS_SYNCHRONOUS = 0
NS_KEEP_MEASUREMENT_SETS = 0
NS_WSCLEAN_MGAIN = 0.8
NS_WSCLEAN_NITER = 100

[benchmark.production.r2d2]
NS_NLIVE = 150
NS_NUM_REPEATS = 15
NS_MAX_NDEAD = -1
NS_SEED = 1
NS_METRIC = "total_rms_jy"
NS_SYNCHRONOUS = 0
NS_KEEP_MEASUREMENT_SETS = 0
